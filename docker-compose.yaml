version: '3.8'

services:
  # 1. Neo4j Database Service
  neo4j-db:
    image: neo4j:5.10.0
    container_name: myhealthinsure_neo4j_container
    ports:
      - "7474:7474" # Neo4j Browser
      - "7687:7687" # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-password} # Use the password from .env or default to 'neo4j'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  # 2. FastAPI Backend Service
  myhealthinsure-api-gateway:
    build: .
    container_name: myhealthinsure_fastapi_container
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j-db:7687} # <-- Changed to point to the container
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./database:/app/database
    depends_on:
      - neo4j-db # Ensures Neo4j starts before FastAPI

  # 3. React Frontend Service
  myhealthinsure-react-ui:
    build: ./frontend
    container_name: myhealthinsure_react_container
    ports:
      - "3000:80"
    depends_on:
      - myhealthinsure-api-gateway

# Persistent volumes so your graph data isn't lost when containers stop
volumes:
  neo4j_data:
  neo4j_logs:
