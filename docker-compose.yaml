version: '3.8'

services:
  myhealthinsure-api-gateway:
    build: .
    container_name: myhealthinsure_fastapi_container
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - NEO4J_URI=${NEO4J_URI:-bolt://host.docker.internal:7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
    volumes:
      - ./data:/app/data
      - ./database:/app/database
    extra_hosts:
      - "host.docker.internal:host-gateway"

  myhealthinsure-react-ui:
    build: ./frontend
    container_name: myhealthinsure_react_container
    ports:
      - "3000:80" # Maps local port 3000 to internal Nginx container port 80
    depends_on:
      - myhealthinsure-api-gateway
